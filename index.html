<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>وارثان خاکستر</title>
<style>
:root{--gold:#e7c47b;--panel:#111820ee;--line:#65717c66;--white:#f2f0e9;--muted:#b5b8bb;--red:#c85b58;--green:#76c79a}
.topbar,.quest,.dialogue{display:none!important}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111820;color:var(--white);font-family:Tahoma,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer;color:inherit}#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#273a3d}.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#0a101c7d,transparent 28%,transparent 65%,#0a101c88)}.hud{position:absolute;inset:0;pointer-events:none;display:none}.hud button,.hud .interactive{pointer-events:auto}.topbar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.plate{background:#101820d9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;backdrop-filter:blur(8px);box-shadow:0 8px 28px #0002}.brandmini{font-size:12px;color:var(--gold);letter-spacing:1px}.statrow{display:flex;gap:10px;align-items:center;font-size:12px;flex-wrap:wrap}.bar{width:100px;height:6px;background:#485056;border-radius:9px;overflow:hidden;display:inline-block;margin-right:4px}.bar i{display:block;width:100%;height:100%;background:var(--red)}.bar.xp i{background:var(--gold)}.quest{position:absolute;top:105px;right:14px;max-width:280px;width:44%;line-height:1.9;font-size:13px}.quest b{color:var(--gold)}.cross{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:#fff9;text-shadow:0 1px 5px #000}.bottom{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}.dialogue{max-width:min(490px,65%);line-height:1.9;font-size:13px}.dialogue strong{color:var(--gold);display:block;margin-bottom:3px}.buttons{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{background:#171f28df;border:1px solid #ffffff35;border-radius:8px;padding:11px 14px;min-height:44px;transition:.15s}.btn:hover{border-color:var(--gold);background:#2b3033}.btn.gold{background:var(--gold);color:#171719;border-color:var(--gold);font-weight:bold}.btn.danger{border-color:#a54d4d}.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(90deg,#0a1013d9,#1018209c 55%,#0a1013df);overflow:auto}.screen.hidden{display:none}.menu{width:min(960px,100%);display:grid;grid-template-columns:1fr;gap:35px;align-items:center}.eyebrow{color:var(--gold);letter-spacing:3px;font-size:12px;margin-bottom:16px}.title{font-size:clamp(40px,8vw,84px);line-height:1.15;font-weight:900;margin:0;text-shadow:0 5px 25px #0008}.subtitle{font-size:17px;line-height:1.9;color:#d3d0c8;max-width:540px;margin:18px 0 26px}.menu-actions{display:flex;gap:10px;flex-wrap:wrap}.sidebox{border-right:1px solid #e7c47b77;padding:10px 24px 10px 0;color:#c9c9c3;line-height:2}.sidebox h3{color:var(--gold);font-size:13px;letter-spacing:1px}.sidebox p{font-size:13px}.foot{position:absolute;bottom:15px;left:20px;right:20px;display:flex;justify-content:space-between;color:#a5a7a5;font-size:11px;gap:10px}.settingsbox{width:min(520px,100%);background:#111820f5;border:1px solid var(--line);padding:25px;border-radius:14px}.settingsbox h2{font-size:27px;margin:0 0 20px}.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.setting label{font-size:14px}.setting small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.setting input[type=range]{width:150px;accent-color:var(--gold)}.setting select{background:#26313a;color:white;border:1px solid #66717a;padding:8px;border-radius:6px}.modal{position:absolute;inset:0;background:#06090dcc;display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{width:min(560px,100%);background:#151d24;border:1px solid #8b7957;padding:24px;border-radius:12px;line-height:1.9}.modalbox h2{color:var(--gold);margin-top:0}.modalbox p{color:#d2d0c9}.touch{position:absolute;bottom:15px;left:15px;display:none;grid-template-columns:repeat(3,45px);grid-template-rows:repeat(2,45px);gap:4px;pointer-events:auto}.touch button{background:#121a20b8;border:1px solid #ffffff55;border-radius:9px;font-size:20px}.touch .up{grid-column:2}.touch .left{grid-column:1;grid-row:2}.touch .down{grid-column:2;grid-row:2}.touch .right{grid-column:3;grid-row:2}.toast{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);background:#101820ee;border:1px solid #e7c47b88;padding:12px 20px;border-radius:8px;display:none;text-align:center;max-width:85%;line-height:1.8}.fade{position:absolute;inset:0;background:#070b10;pointer-events:none;opacity:0;transition:opacity .5s}.fade.on{opacity:1}@media(max-width:650px){.menu{grid-template-columns:1fr;gap:14px}.sidebox{display:none}.title{font-size:50px}.subtitle{font-size:14px;margin:12px 0 20px}.foot{font-size:9px}.quest{top:100px;right:8px;width:54%;font-size:11px}.topbar{top:8px;left:8px;right:8px}.plate{padding:8px}.bar{width:58px}.bottom{left:8px;right:8px;bottom:8px;align-items:flex-end}.dialogue{max-width:58%;font-size:11px}.buttons{gap:4px}.btn{padding:9px 10px;font-size:12px}.touch{display:grid}.hud .bottom{bottom:110px}.hud .quest{top:88px}.statrow{gap:5px}.brandmini{font-size:10px}}@media(hover:none){.touch{display:grid}}
</style>
</head>
<body>
<canvas id="world"></canvas><div class="shade"></div>
<div class="hud" id="hud">
<div class="topbar">
<div class="plate"><div class="brandmini">وارثان خاکستر</div><div style="font-weight:bold;margin-top:5px" id="heroName">آرمان</div></div>
<div class="plate"><div class="statrow">جان <span class="bar"><i id="healthBar"></i></span><span id="healthText">100</span></div><div class="statrow" style="margin-top:8px">تجربه <span class="bar xp"><i id="xpBar"></i></span><span id="levelText">سطح ۱</span></div></div>
<div class="plate statrow">✦ <b id="goldText">35</b></div>
</div>
<div class="plate quest"><div class="brandmini">هدف فعلی</div><b id="questTitle">صدای جنگل</b><div id="questText">به فانوس خاموش نزدیک شو.</div><div id="questCount" style="color:#9fa9ac;font-size:11px;margin-top:5px">مأموریت اصلی · فصل اول</div></div>
<div class="cross">+</div>
<div class="bottom"><div class="plate dialogue" id="dialogue"><strong id="speaker">راهنما</strong><span id="dialogueText">باد از میان درختان می‌گذرد...</span></div><div class="buttons"><button class="btn" id="interact">تعامل · E</button><button class="btn" id="potion">معجون · Q</button><button class="btn gold" id="attack">حمله · کلیک</button><button class="btn" id="pause">Ⅱ</button></div></div>
<div class="touch"><button class="up" data-move="forward">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="back">▼</button><button class="right" data-move="right">▶</button></div>
<div class="toast" id="toast"></div>
</div>
<div class="screen" id="mainMenu"><div class="menu"><div><h1 class="title">وارثان<br>خاکستر</h1><div class="menu-actions"><button class="btn gold" id="newGame">شروع بازی</button><button class="btn" id="continueGame">ادامه بازی</button><button class="btn" id="openSettings">تنظیمات</button><button class="btn" id="credits">سازندگان</button></div></div></div><div class="foot"><span>نسخه ۱.۰ · تجربه آفلاین</span></div></div>
<div class="screen hidden" id="settings"><div class="settingsbox"><h2>تنظیمات</h2><div class="setting"><div><label for="sensitivity">حساسیت نگاه</label><small>سرعت چرخش دوربین</small></div><input id="sensitivity" type="range" min="1" max="10" value="5"></div><div class="setting"><div><label for="volume">صدای بازی</label><small>کنترل صدای افکت‌ها</small></div><input id="volume" type="range" min="0" max="100" value="60"></div><div class="setting"><div><label for="quality">کیفیت تصویر</label><small>جزئیات محیط</small></div><select id="quality"><option value="high">بالا</option><option value="medium">متوسط</option><option value="low">سبک</option></select></div><div class="setting"><div><label for="invert">وارونگی نگاه عمودی</label></div><input id="invert" type="checkbox"></div><div class="menu-actions" style="margin-top:20px"><button class="btn gold" id="saveSettings">ذخیره</button><button class="btn" id="backSettings">بازگشت</button></div></div></div>
<div class="modal" id="storyModal"><div class="modalbox"><h2 id="modalTitle">فانوس خاموش</h2><p id="modalText"></p><div id="choices" class="menu-actions"></div></div></div>
<div class="screen hidden" id="pauseMenu"><div class="settingsbox"><div class="eyebrow">بازی متوقف شد</div><h2>مکث</h2><div class="menu-actions"><button class="btn gold" id="resume">ادامه بازی</button><button class="btn" id="pauseSettings">تنظیمات</button><button class="btn" id="toMain">منوی اصلی</button></div></div></div>
<script>
(()=>{
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,playing=false,paused=false,dead=false,px=0,pz=0,yaw=0,pitch=0,keys={},touch={},last=0,attackAnim=0,toastTime=0,storyStep=0,branch='',health=100,xp=0,gold=35,potions=3,level=1,quest=0,chapter=1,settings={sensitivity:5,volume:60,quality:'high',invert:false},pointer=false,drag=null,audioCtx=null;
const things=[];
function add(type,x,z,o={}){things.push({type,x,z,size:1,color:'#777',alive:true,...o})}
function populate(){
things.length=0;
add('lamp',0,5,{size:1.2,name:'فانوس خاموش'});
add('npc',-2.5,3,{size:1,name:'مِهرا',color:'#668c91',talked:false});
add('npc',7,8,{size:1,name:'پیرمرد',color:'#a28a70',talked:false});
add('house',-6,7,{size:2,color:'#82664d'});add('house',6,13,{size:2.4,color:'#8c6e51'});add('house',-10,16,{size:2,color:'#725f50'});
for(let i=0;i<22;i++){let x=(Math.random()-.5)*44,z=(Math.random()-.5)*55;if(Math.abs(x)<3&&Math.abs(z)<5)continue;add('tree',x,z,{size:.8+Math.random()*1.6,color:['#294f3f','#345e47','#3e694a'][i%3]})}
add('enemy',3,-7,{size:1.2,name:'سایه‌خوار',hp:55,maxHp:55,color:'#252b35',alive:true,dead:false});
add('enemy',-8,-16,{size:1.4,name:'گرگ خاکستر',hp:80,maxHp:80,color:'#53525a',alive:true,dead:false});
for(let i=0;i<65;i++)add('grass',(Math.random()-.5)*48,(Math.random()-.5)*54,{size:.2+Math.random()*.3,color:['#8ca66c','#b3b77c','#d0c58d'][i%3]});
}
function resize(){dpr=Math.min(devicePixelRatio||1,settings.quality==='low'?1:settings.quality==='medium'?1.35:1.8);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function sound(freq=220,duration=.07){if(!settings.volume)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.value=settings.volume/100*.04;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration)}catch(e){}}
function say(speaker,text){$('speaker').textContent=speaker;$('dialogueText').textContent=text}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';toastTime=2.4}
function updateUI(){$('healthText').textContent=health;$('healthBar').style.width=health+'%';$('xpBar').style.width=xp+'%';$('levelText').textContent='سطح '+['۱','۲','۳','۴','۵'][Math.min(level-1,4)];$('goldText').textContent=gold;$('heroName').textContent='آرمان';$('potion').textContent='معجون · Q ('+potions+')';const qs=[['صدای جنگل','به فانوس خاموش نزدیک شو.'],['راز فانوس','با مِهرا صحبت کن.'],['ردّ سایه','سایه‌خوار را در جنگل شکست بده.'],['راه زیر ریشه‌ها','به پیرمرد روستا برگرد.'],['انتخاب وارث','تصمیمت را بگیر.'],['شعله‌ی تازه','جنگل دیگر مثل قبل نخواهد بود.']];$('questTitle').textContent=qs[Math.min(quest,5)][0];$('questText').textContent=qs[Math.min(quest,5)][1];$('questCount').textContent='مأموریت اصلی · فصل '+chapter}
function project(x,y,z){let dx=x-px,dz=z-pz,c=Math.cos(yaw),s=Math.sin(yaw),side=dx*c-dz*s,depth=dx*s+dz*c;if(depth<.15)return null;let focal=Math.min(W,H)*.88;return{x:W/2+side*focal/depth,y:H*.5-(y-pitch)*focal/depth,scale:focal/depth,depth}}
function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill()}
function sky(){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#263b4b');g.addColorStop(.48,'#8a9b91');g.addColorStop(.51,'#4a5e45');g.addColorStop(1,'#172b26');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#e0d5ad';ctx.beginPath();ctx.arc(W*.76,H*.17,Math.min(W,H)*.035,0,7);ctx.fill();ctx.fillStyle='#263b35';ctx.beginPath();ctx.moveTo(0,H*.48);for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,H*.4+Math.sin(x*.015)*H*.035);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();ctx.fillStyle='#304a38';ctx.fillRect(0,H*.52,W,H*.48)}
function drawThing(o,p){let s=Math.min(220,p.scale*o.size*.42),x=p.x,y=p.y;if(o.type==='grass'){ctx.strokeStyle=o.color;ctx.lineWidth=Math.max(1,s*.08);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s*.2,y-s*.7);ctx.moveTo(x,y);ctx.lineTo(x+s*.2,y-s*.55);ctx.stroke();return}if(o.type==='tree'){ctx.fillStyle='#443c30';ctx.fillRect(x-s*.1,y-s*.25,s*.2,s*.75);ctx.fillStyle=o.color;for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(x,y-s*(1.35+i*.3));ctx.lineTo(x-s*(.7-i*.1),y-s*(.15+i*.22));ctx.lineTo(x+s*(.7-i*.1),y-s*(.15+i*.22));ctx.fill()}return}if(o.type==='house'){polygon([{x:x-s,y:y},{x:x+s,y:y},{x:x+s*.85,y:y+s},{x:x-s*.85,y:y+s}],o.color);polygon([{x:x-s*1.2,y:y},{x,y:y-s*.75},{x:x+s*1.2,y:y}], '#443a35');ctx.fillStyle='#d6b877';ctx.fillRect(x-s*.15,y+s*.48,s*.3,s*.52);return}if(o.type==='lamp'){ctx.fillStyle='#382f29';ctx.fillRect(x-s*.08,y-s*.15,s*.16,s*.85);ctx.fillStyle='#d9b96b';ctx.fillRect(x-s*.22,y-s*.55,s*.44,s*.4);ctx.fillStyle='#ffdd91';ctx.beginPath();ctx.arc(x,y-s*.35,s*.28,0,7);ctx.fill();return}
ctx.fillStyle='#0005';ctx.beginPath();ctx.ellipse(x,y+s*1.3,s*.6,s*.16,0,0,7);ctx.fill();ctx.fillStyle=o.color;ctx.fillRect(x-s*.4,y+s*.25,s*.8,s*.9);ctx.fillStyle='#d4ad8a';ctx.beginPath();ctx.arc(x,y+s*.08,s*.33,0,7);ctx.fill();ctx.fillStyle='#242b2e';ctx.fillRect(x-s*.18,y+s*.02,s*.08,s*.07);ctx.fillRect(x+s*.1,y+s*.02,s*.08,s*.07);
if(o.type==='enemy'){ctx.fillStyle='#f3eee0';ctx.fillRect(x-s*.18,y+s*.18,s*.1,s*.12);ctx.fillRect(x+s*.08,y+s*.18,s*.1,s*.12);ctx.fillStyle='#1a1718';ctx.fillRect(x-s*.5,y-s*.18,s,4);ctx.fillStyle='#b84f4a';ctx.fillRect(x-s*.5,y-s*.18,s*Math.max(0,o.hp/o.maxHp),4)}
ctx.fillStyle='#fff';ctx.font='bold '+Math.max(10,Math.min(14,s*.35))+'px Tahoma';ctx.textAlign='center';ctx.fillText(o.name,x,y-s*.32)}
function render(){sky();const vis=things.map(o=>({o,p:project(o.x,0,o.z)})).filter(a=>a.p&&a.p.depth<55).sort((a,b)=>b.p.depth-a.p.depth);for(const a of vis)if(a.o.alive||a.o.type==='grass')drawThing(a.o,a.p);if(attackAnim>0){ctx.strokeStyle='#e7c47b';ctx.lineWidth=5;ctx.beginPath();ctx.arc(W/2,H*.55,Math.min(W,H)*.09,Math.PI*1.1,Math.PI*1.85);ctx.stroke()}}
function nearest(type,range=3.2){return things.filter(o=>o.type===type&&o.alive&&Math.hypot(o.x-px,o.z-pz)<range).sort((a,b)=>Math.hypot(a.x-px,a.z-pz)-Math.hypot(b.x-px,b.z-pz))[0]}
function gain(n){xp+=n;while(xp>=100){xp-=100;level++;health=Math.min(100,health+20);toast('سطح '+level+' باز شد');sound(660,.18)}updateUI()}
function start(){populate();px=0;pz=0;yaw=0;pitch=0;health=100;xp=0;gold=35;potions=3;level=1;quest=0;chapter=1;storyStep=0;branch='';dead=false;playing=true;paused=false;$('mainMenu').classList.add('hidden');$('settings').classList.add('hidden');$('pauseMenu').classList.add('hidden');$('hud').style.display='block';say('صدای ناشناس','آرمان... اگر صدایم را می‌شنوی، فانوس را روشن نکن.');updateUI();toast('جنگل بی‌صدا · فصل اول');sound(330,.15)}
function interact(){if(!playing||paused||dead)return;let lamp=nearest('lamp',3.2),npc=nearest('npc',3.2),enemy=nearest('enemy',3.5);if(lamp&&quest===0){quest=1;say('آرمان','این نشان متعلق به پدرم است... چرا هنوز گرم است؟');toast('مأموریت به‌روزرسانی شد');gain(10);updateUI();return}if(npc){if(npc.name==='مِهرا'){if(quest<=1){quest=2;say('مِهرا','پدرت نگهبان آخرین شعله بود. سایه‌خوارها از صدای فانوس تغذیه می‌کنند. اگر خاموش بماند، راه خانه را پیدا می‌کنند.');gold+=10;toast('۱۰ سکه دریافت کردی');gain(10)}else if(quest===4){quest=5;chapter=2;if(branch==='save'){say('مِهرا','پس شعله را نجات می‌دهیم؛ حتی اگر جنگل بهایش را بخواهد.');health=Math.min(100,health+30)}else{say('مِهرا','صدای جنگل آرام شد... اما چیزی درون فانوس بیدار مانده است.');gold+=40}toast('فصل دوم باز شد');gain(25)}else say('مِهرا','راهت را انتخاب کرده‌ای. حالا باید با پیامدهایش زندگی کنی.')}else{if(quest===3){quest=4;say('پیرمرد','زیر ریشه‌ی درخت سپید، قلب شعله پنهان است. می‌توانی آن را آزاد کنی و جنگل را نجات دهی، یا برای همیشه مهرومومش کنی.');showChoice()}else say('پیرمرد','درخت سپید را پیدا کن. صدای آن را با صدای خودت اشتباه نگیر.')}updateUI();return}if(enemy){say(enemy.name,'صدای خش‌خش و غرش از دل تاریکی می‌آید.');return}toast('چیزی برای تعامل در نزدیکی تو نیست.')}
function showChoice(){ $('modalTitle').textContent='انتخاب وارث';$('modalText').textContent='قلب شعله را آزاد کنی، جنگل زنده می‌شود اما سایه‌ها نیز بازمی‌گردند. آن را مهروموم کنی، روستا امن می‌ماند اما جادوی کهن برای همیشه خاموش می‌شود.';$('choices').innerHTML='';[['آزاد کردن شعله','save'],['مهروموم کردن شعله','seal']].forEach(([label,val])=>{let b=document.createElement('button');b.className='btn '+(val==='save'?'gold':'');b.textContent=label;b.onclick=()=>{branch=val;$('storyModal').classList.remove('show');quest=4;say('آرمان',val==='save'?'شعله را آزاد می‌کنم؛ این جنگل هنوز شایسته‌ی زندگی است.':'شعله را مهروموم می‌کنم. دیگر اجازه نمی‌دهم تاریکی از آن عبور کند.');updateUI();toast('تصمیم تو ثبت شد');};$('choices').appendChild(b)});$('storyModal').classList.add('show')}
function attack(){if(!playing||paused||dead)return;attackAnim=.22;let e=nearest('enemy',4.3);sound(160,.06);if(!e){toast('هدف در برد ضربه نیست');return}e.hp-=28+level*5;if(e.hp<=0){e.alive=false;gold+=18;gain(35);say('آرمان','این یکی دیگر کسی را تعقیب نخواهد کرد.');if(quest===2){quest=3;toast('هدف کامل شد: سایه‌خوار شکست خورد')}else toast(e.name+' شکست خورد · ۱۸ سکه');if(!things.some(o=>o.type==='enemy'&&o.alive)){toast('جنگل برای لحظه‌ای ساکت شد.')} }else{health=Math.max(0,health-9);say(e.name,'موجود به تو حمله کرد!');if(health===0){dead=true;showEnding('پایان سفر','در تاریکی فرو رفتی؛ اما قصه‌ی وارث هنوز می‌تواند از نو آغاز شود.')}}updateUI()}
function showEnding(title,text){$('modalTitle').textContent=title;$('modalText').textContent=text;$('choices').innerHTML='';let b=document.createElement('button');b.className='btn gold';b.textContent='بازگشت به منوی اصلی';b.onclick=()=>{$('storyModal').classList.remove('show');playing=false;$('hud').style.display='none';$('mainMenu').classList.remove('hidden')};$('choices').appendChild(b);$('storyModal').classList.add('show')}
function potion(){if(!playing||paused||dead)return;if(!potions){toast('معجون نداری');return}if(health>=100){toast('سلامتی کامل است');return}potions--;health=Math.min(100,health+40);say('آرمان','تلخی گیاهان... اما هنوز زنده‌ام.');sound(520,.12);updateUI()}
function move(dt){if(!playing||paused||dead)return;let f=(keys.w||keys.W||keys.ArrowUp||touch.forward?1:0)-(keys.s||keys.S||keys.ArrowDown||touch.back?1:0),r=(keys.d||keys.D||keys.ArrowRight||touch.right?1:0)-(keys.a||keys.A||keys.ArrowLeft||touch.left?1:0);if(!f&&!r)return;let len=Math.hypot(f,r);f/=len;r/=len;let sp=5*dt,nx=px+Math.sin(yaw)*f*sp+Math.cos(yaw)*r*sp,nz=pz+Math.cos(yaw)*f*sp-Math.sin(yaw)*r*sp;if(Math.abs(nx)<24&&Math.abs(nz)<29){if(!things.some(o=>(o.type==='house'||o.type==='tree')&&Math.hypot(o.x-nx,o.z-nz)<o.size+.55)){px=nx;pz=nz}}}
function frame(t){let dt=Math.min(.045,(t-last)/1000||0);last=t;move(dt);if(attackAnim>0)attackAnim-=dt;if(toastTime>0){toastTime-=dt;if(toastTime<=0)$('toast').style.display='none'}render();requestAnimationFrame(frame)}
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='q')potion();if(e.key===' ')attack();if(e.key==='Escape'&&playing)togglePause()});document.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('click',()=>{if(!playing||paused)return;if(matchMedia('(pointer:fine)').matches){if(document.pointerLockElement!==canvas)canvas.requestPointerLock?.();else attack()}});
document.addEventListener('mousemove',e=>{if(playing&&!paused&&document.pointerLockElement===canvas){yaw+=e.movementX*.002*(settings.sensitivity/5);pitch=Math.max(-.45,Math.min(.45,pitch+e.movementY*.001*(settings.invert?-1:1)*(settings.sensitivity/5)))}});
canvas.addEventListener('pointerdown',e=>{if(!playing||paused||matchMedia('(pointer:fine)').matches)return;drag={x:e.clientX,y:e.clientY,id:e.pointerId};canvas.setPointerCapture?.(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;yaw-=dx*.006*(settings.sensitivity/5);pitch=Math.max(-.45,Math.min(.45,pitch+dy*.003*(settings.invert?-1:1)));drag.x=e.clientX;drag.y=e.clientY});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);
document.querySelectorAll('[data-move]').forEach(b=>{let k=b.dataset.move;let off=()=>touch[k]=false;b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off))});
function togglePause(){if(!playing)return;paused=!paused;$('pauseMenu').classList.toggle('hidden',!paused);if(paused&&document.pointerLockElement)document.exitPointerLock?.()}
$('attack').onclick=attack;$('interact').onclick=interact;$('potion').onclick=potion;$('pause').onclick=togglePause;$('newGame').onclick=start;$('continueGame').onclick=()=>{if(things.length){playing=true;paused=false;$('mainMenu').classList.add('hidden');$('hud').style.display='block'}else start()};$('resume').onclick=togglePause;$('toMain').onclick=()=>{paused=false;playing=false;$('hud').style.display='none';$('pauseMenu').classList.add('hidden');$('mainMenu').classList.remove('hidden')};
$('openSettings').onclick=()=>{$('mainMenu').classList.add('hidden');$('settings').classList.remove('hidden')};$('pauseSettings').onclick=()=>{$('pauseMenu').classList.add('hidden');$('settings').classList.remove('hidden')};$('backSettings').onclick=()=>{if(playing){$('settings').classList.add('hidden');$('pauseMenu').classList.remove('hidden')}else{$('settings').classList.add('hidden');$('mainMenu').classList.remove('hidden')}};
$('saveSettings').onclick=()=>{settings.sensitivity=+$('sensitivity').value;settings.volume=+$('volume').value;settings.quality=$('quality').value;settings.invert=$('invert').checked;resize();$('settings').classList.add('hidden');if(playing&&paused)$('pauseMenu').classList.remove('hidden');else $('mainMenu').classList.remove('hidden');toast('تنظیمات ذخیره شد')};
$('credits').onclick=()=>{ $('modalTitle').textContent='وارثان خاکستر';$('modalText').textContent='ساخته‌شده با HTML، CSS و JavaScript. داستان، محیط و مبارزه در یک تجربه‌ی آفلاین.';$('choices').innerHTML='';let b=document.createElement('button');b.className='btn gold';b.textContent='بازگشت';b.onclick=()=>$('storyModal').classList.remove('show');$('choices').appendChild(b);$('storyModal').classList.add('show')};
populate();updateUI();requestAnimationFrame(frame);
})();
</script>
</body></html>
